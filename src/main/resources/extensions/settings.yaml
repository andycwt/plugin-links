apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-links-settings
spec:
  forms:
    - group: base
      label: 基本設定
      formSchema:
        - $formkit: text
          label: 頁面標題
          name: title
          validation: required
          value: "連結"
    - group: verification
      label: 連結檢測
      formSchema:
        - $formkit: checkbox
          label: 啟用自動定時檢測
          name: enabled
          id: verification_enabled
          value: false
          help: 啟用後，系統會自動定時檢測連結的可達性，並更新連結的可達性狀態，如果關閉，可以在連結管理頁面手動檢測
        - $formkit: number
          if: "$get(verification_enabled).value === true"
          label: 檢測間隔（小時）
          name: intervalHours
          validation: required|number|min:1
          value: 24
        - $formkit: number
          if: "$get(verification_enabled).value === true"
          label: 每輪最多檢測連結數
          name: maxLinksPerRun
          validation: required|number|min:1
          value: 50
        - $formkit: checkbox
          if: "$get(verification_enabled).value === true"
          label: 同時檢測反鏈
          name: checkBacklink
          value: false
    - group: rss
      label: RSS 訂閱
      formSchema:
        - $formkit: checkbox
          label: 啟用自動獲取
          name: enabled
          id: rss_refresh_enabled
          value: true
          help: 啟用後，系統會自動定時獲取連結的 RSS 訂閱，並更新連結的 RSS 訂閱狀態，如果關閉，可以在連結訂閱頁面手動獲取
        - $formkit: number
          if: "$get(rss_refresh_enabled).value === true"
          label: 獲取間隔（小時）
          name: intervalHours
          validation: required|number|min:1
          value: 1
        - $formkit: number
          if: "$get(rss_refresh_enabled).value === true"
          label: 每輪最多獲取連結數
          name: maxLinksPerRun
          validation: required|number|min:1
          value: 50
        - $formkit: checkbox
          label: 公開 RSS 訂閱動態
          name: publicEnabled
          value: false
          help: 部分主題可能需要顯示 RSS 訂閱資訊，開啟後匿名訪問者和主題可以讀取已抓取的 RSS 條目，請確認風險之後再決定是否開啟
    - group: application
      label: 友鏈申請
      formSchema:
        - $formkit: checkbox
          label: 啟用友鏈申請
          name: enabled
          id: link_application_enabled
          value: false
          help: 總開關。關閉後訪客提交和評論自動識別都不會建立新申請，已有申請仍可繼續稽核
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: selfSubmission
          label: 訪客自助申請
          children:
            - $formkit: checkbox
              label: 允許訪客提交
              name: enabled
              value: true
              help: 允許訪客透過原生 Form 或 REST API 提交申請，主題應根據 linkApplicationEnabled 決定是否展示申請入口
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: security
          label: 安全
          children:
            - $formkit: number
              label: 待稽核申請容量
              name: pendingCapacity
              step: 1
              validation: 'required|number|min:1|matches:/^[1-9][0-9]*$/'
              value: 100
              help: 限制待稽核友鏈申請的最大數量。達到上限後將暫停接收新申請，直到待稽核數量下降
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: commentRecognition
          label: 從新評論中識別友鏈申請
          children:
            - $formkit: checkbox
              label: 開啟
              name: enabled
              id: comment_application_recognition_enabled
              value: false
              help: 需要在應用市場安裝並啟用 AI Foundation 外掛，且所選模型必須支援結構化輸出，開啟之後會根據評論來源配置自動識別友鏈申請並建立新申請，此功能將在每次有新評論的時候觸發，所以請根據實際需要開啟
            - $formkit: aiModelSelector
              if: "$get(comment_application_recognition_enabled).value === true"
              modelType: language
              clearable: true
              name: modelName
              key: recognitionModelName
              label: 識別模型
              placeholder: 請選擇支援結構化輸出的語言模型
              validation: required
            - $formkit: repeater
              if: "$get(comment_application_recognition_enabled).value === true"
              name: sources
              label: 評論來源
              value: []
              validation: required
              min: 1
              children:
                - $formkit: select
                  name: type
                  label: 頁面型別
                  validation: required
                  options:
                    - label: 連結頁面
                      value: LINKS
                    - label: 文章
                      value: POST
                    - label: 頁面
                      value: SINGLE_PAGE
                - $formkit: postSelect
                  if: "$value.type === 'POST'"
                  name: name
                  label: 文章
                  validation: required
                  clearable: false
                - $formkit: singlePageSelect
                  if: "$value.type === 'SINGLE_PAGE'"
                  name: name
                  label: 頁面
                  validation: required
                  clearable: false
        - $formkit: group
          if: "$get(link_application_enabled).value === true"
          name: notification
          label: 申請通知
          children:
            - $formkit: checkbox
              label: 開啟通知
              name: enabled
              id: link_application_notification_enabled
              value: false
              help: 新的友鏈申請建立成功後，透過 Halo 通知機制提醒所選管理員
            - $formkit: userSelect
              if: "$get(link_application_notification_enabled).value === true"
              name: recipients
              label: 接收通知的管理員
              value: []
              multiple: true
              validation: required
              help: >-
                請選擇擁有連結管理許可權的管理員，外掛不會自動校驗許可權。外掛會按此列表維護通知訂閱；
                郵件中的取消訂閱不會修改此列表，如需停止接收，請移除使用者或由使用者在個人通知偏好中關閉此型別
    - group: ai
      label: AI
      formSchema:
        - $formkit: checkbox
          label: 開啟 AI 功能
          name: enabled
          id: ai_enabled
          value: false
          help: 開啟後，可以在支援的場景中使用 AI Foundation 提供的模型能力，需要在應用市場安裝並啟用 AI Foundation 外掛
        - $formkit: group
          if: "$get(ai_enabled).value === true"
          name: commentExtraction
          label: 新增連結時從最新評論中解析
          children:
            - $formkit: checkbox
              label: 開啟
              name: enabled
              id: ai_comment_extraction_enabled
              value: true
            - $formkit: aiModelSelector
              if: "$get(ai_comment_extraction_enabled).value === true"
              label: AI 模型
              modelType: language
              clearable: true
              name: modelName
              key: modelName
              placeholder: 請選擇語言模型
              help: 可選，不設定時會使用 AI Foundation 的預設語言模型。
